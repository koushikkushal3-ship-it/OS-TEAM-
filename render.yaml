# Render blueprint for the TEAM OS backend (API). Render → New → Blueprint → pick this GitHub repo.
# Every push to main redeploys automatically once GitHub checks pass. Database changes
# (prisma migrations) are applied on start, before the API accepts requests.
services:
  - type: web
    name: teamos-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: BACKEND
    # --include=dev: the build tools (Nest CLI, Prisma CLI) are dev dependencies.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_SCHEMA
        value: app
      - key: AUTH_DEV_LOGIN
        value: "false"
      - key: AUTH_GOOGLE_ENABLED
        value: "false"
      # The website on Vercel forwards /api calls here, so there are two proxies in front of the API.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Render asks for these on first setup. Copy DATABASE_URL, DIRECT_URL and MFA_ENCRYPTION_KEY
      # exactly from BACKEND/.env — MFA_ENCRYPTION_KEY must be identical, or the saved authenticator
      # setup cannot be read. FRONTEND_URL is your Vercel address (a placeholder is fine at first).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
